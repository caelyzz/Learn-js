<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 02 - Kuis dengan Skor</title>
</head>
<body>

  <h2>Soal 02: Kuis dengan Skor</h2>

  <p id="tanyaKuis">Soal akan muncul di sini</p>
  <button id="pilihanBenar">Jawaban A</button>
  <button id="pilihanSalah">Jawaban B</button>
  <p id="skorKuis">Skor: 0</p>

  <script>
    // Tuliskan JavaScript kamu di sini 

    const soal = [
      { pertanyaan: "2 + 2 = ?", benar: "4", salah: "5" },
      { pertanyaan: "Ibu kota Jepang?", benar: "Tokyo", salah: "Osaka" },
      { pertanyaan: "Warna langit siang hari?", benar: "Biru", salah: "Merah" }
    ];

    let soalKe = 0;
    let skor = 0;
    
    let teksSoal = document.getElementById("tanyaKuis")
    let jbBenar = document.getElementById("pilihanBenar")
    let jbSalah = document.getElementById("pilihanSalah")
    const skorTotal = document.getElementById("skorKuis")

    tampilSoal()


    function tampilSoal(){
      teksSoal.innerText = soal[soalKe].pertanyaan
      jbBenar.innerText = soal[soalKe].benar
      jbSalah.innerText = soal[soalKe].salah
      skorTotal.innerText = "Skor: " + skor
    }

    function lanjutSoal(){
        if (soalKe < soal.length){
          tampilSoal()
        }
        else{
          jbBenar.disabled = true
          jbSalah.disabled = true

          teksSoal.innerText = ""
          skorTotal.innerText = `Kuis selesai! Skormu: ${skor}/${soal.length}`
        }
    }

    jbBenar.addEventListener("click", function(){
      soalKe++
      skor++
      lanjutSoal()
    })

    jbSalah.addEventListener("click", function(){
      soalKe++
      lanjutSoal()
    })
    
  </script>
</body>
</html>
