<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 02 - Kuis dengan Skor</title>
</head>
<body>

  <h2>Soal 02: Kuis dengan Skor</h2>

  <p id="tanyaKuis">Soal akan muncul di sini</p>
  <!-- <teks id="jbA">a. </teks>
  <teks id="jbB">b. </teks>
  <teks id="jbC">c. </teks>
  <teks id="jbD">d. </teks> -->
  <button id="pgA">Jawaban A</button>
  <button id="pgB">Jawaban B</button>
  <button id="pgC">Jawaban C</button>
  <button id="pgD">Jawaban D</button>
  <p id="skorKuis">Skor: 0</p>

  <script>
    // Tuliskan JavaScript kamu di sini 

    const soal = [
      {
        pertanyaan: "dimana smk8?",
        pilihan: {A:"pasar minggu", B:"pejaten", C:"jaksel", D:"jakarta"},
        jawaban: "B"
      },
      {
        pertanyaan: "dimana markas bin?",
        pilihan: {A:"kalibata", B:"kemang", C:"sudirman", D:"blok m"},
        jawaban: "A"
      },
      {
        pertanyaan: "siapa yang paling jomok di rpl",
        pilihan: {A:"gifari", B:"alif", C:"ataya", D:"adam"},
        jawaban: "C"
      },
      {
        pertanyaan: "siapa yang aku suka",
        pilihan: {A:"kinan", B:"jejes", C:"mira", D:"jane"},
        jawaban: "D"
      }
    ];

    let soalKe = 0;
    let skor = 0;
    
    let teksSoal = document.getElementById("tanyaKuis")
    let opsiA = document.getElementById("pgA")
    let opsiB = document.getElementById("pgB")
    let opsiC = document.getElementById("pgC")
    let opsiD = document.getElementById("pgD")
    const skorTotal = document.getElementById("skorKuis")

    tampilSoal()

    function tampilSoal(){
      teksSoal.innerText = soal[soalKe].pertanyaan
      opsiA.innerText = soal[soalKe].pilihan.A
      opsiB.innerText = soal[soalKe].pilihan.B
      opsiC.innerText = soal[soalKe].pilihan.C
      opsiD.innerText = soal[soalKe].pilihan.D
      skorTotal.innerText = "Skor: " + skor
    }

    function lanjutSoal(){
        if (soalKe < soal.length){
          tampilSoal()
        }
        else{
          opsiA.disabled = true
          opsiB.disabled = true
          opsiC.disabled = true
          opsiD.disabled = true

          teksSoal.innerText = ""
          skorTotal.innerText = `Kuis selesai! Skormu: ${skor}/${soal.length}`
        }
    }

    opsiA.addEventListener("click", function(){
      if (soal[soalKe].jawaban === "A") skor++;
      soalKe++
      lanjutSoal()
    })

    opsiB.addEventListener("click", function(){
      if (soal[soalKe].jawaban === "B") skor++;
      soalKe++
      lanjutSoal()
    })

    opsiC.addEventListener("click", function(){
      if (soal[soalKe].jawaban === "C") skor++;
      soalKe++
      lanjutSoal()
    })

    opsiD.addEventListener("click", function(){
      if (soal[soalKe].jawaban === "D") skor++;
      soalKe++
      lanjutSoal()
    })
    
  </script>
</body>
</html>
