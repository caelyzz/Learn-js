<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Soal 03 - Warna Acak</title>
</head>

<body>

    <h2>Soal 03: Ubah Warna Background Acak</h2>

    <button id="tombolWarna">Warna Acak!</button>
    <p id="infoWarna">Warna saat ini: -</p>

    <script>
        // Tuliskan JavaScript kamu di sini 
        // Tips: Math.floor(Math.random() * 16777215).toString(16) menghasilkan warna hex acak

        const tombol = document.getElementById("tombolWarna")
        const teks = document.getElementById("infoWarna")
        let warna = 0;

        tombol.addEventListener("click", () => {
            warna = Math.floor(Math.random() * 16777215).toString(16);
            document.body.style.background = "#" + warna;
            teks.innerText = "Warna saat ini:" + "#" + warna
        })        
    </script>
</body>

</html>
