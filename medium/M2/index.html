<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 02 - Validasi Input Nama</title>
</head>

<body>

  <h2>Soal 02: Validasi Input Nama</h2>

  <input type="text" id="inputNama" placeholder="Tulis namamu di sini..." />
  <button id="tombolCek">Cek Nama</button>
  <p id="hasilCek"></p>

  <script>
    const input = document.getElementById("inputNama")
    const tombol = document.getElementById("tombolCek")
    const hasil = document.getElementById("hasilCek")

    tombol.addEventListener("click", function(){
      if (input.value === ""){
        hasil.innerText = "Isi nama terlebih dahulu"
      }else {
        const nama = input.value
        hasil.innerText = "Halo," + nama
      }
    })
  </script>
</body>

</html>
