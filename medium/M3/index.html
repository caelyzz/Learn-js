<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 03 - Penghitung Mundur</title>
</head>
<body>

  <h2>Soal 03: Penghitung Mundur</h2>

  <p id="angkaHitung">10</p>
  <button id="tombolKurangi">Kurangi</button>

  <script>
    let angka = 10;
    const tombol = document.getElementById("tombolKurangi")
    const text = document.getElementById("angkaHitung")

    tombol.addEventListener("click", function(){
      if (angka > 1){
        angka --; text.innerText = angka
      }else{
        tombol.disabled = true; text.innerText = "Liftoff"; 
      }
    })
  </script>
</body>
</html>
