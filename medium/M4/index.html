<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 04 - Ubah Tema Halaman</title>
</head>

<body>

  <h2>Soal 04: Ubah Tema Halaman</h2>

  <button id="tombolGelap">Mode Gelap</button>
  <button id="tombolTerang">Mode Terang</button>
  <p id="statusTema">Status tema akan muncul di sini</p>

  <script>
    const tbGelap = document.getElementById("tombolGelap")
    const tbTerang = document.getElementById("tombolTerang")
    const statusTeks = document.getElementById("statusTema")

    tbGelap.addEventListener("click", function(){
      statusTeks.innerText = "Mode gelap aktif"
      statusTeks.style.color = "white"
      document.body.style.background = "black"
    })

    tbTerang.addEventListener("click", function(){
      statusTeks.innerText = "Mode terang aktif"
      statusTeks.style.color = "black"
      document.body.style.background = "white"
    })
  </script>
</body>

</html>
