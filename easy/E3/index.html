<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 03 - Hitung Klik</title>
</head>
<body>

  <h2> Soal 03: Hitung Klik</h2>

  <p id="tampilKlik">Jumlah Klik: 0</p>
  <button id="tombolKlik">Klik Saya!</button>

  <script>
      let jumlah = 0
      const tampil = document.getElementById("tampilKlik")
      const tombol = document.getElementById("tombolKlik")

      tombol.addEventListener("click", function(){
        jumlah++; tampil.innerText = `Jumlah klik: ${jumlah}`
      })
  </script>
</body>
</html>
