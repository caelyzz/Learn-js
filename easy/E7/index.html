<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 07 - Tampilkan Tanggal</title>
</head>
<body>

  <h2>Soal 07: Tampilkan Tanggal</h2>

  <button id="tombolTanggal">Lihat Tanggal</button>
  <p id="infoTanggal"></p>

  <script>
    const tombol = document.getElementById("tombolTanggal")
    const tanggal = document.getElementById("infoTanggal")

    tombol.addEventListener("click", function(){
      tanggal.innerText = "Hari ini: Senin"
    })
  </script>
</body>
</html>
