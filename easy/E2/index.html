<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Soal 02 - Ganti Nama</title>
</head>

<body>

    <h2> Soal 02: Ganti Nama</h2>

    <h1 id="judul">Nama: ???</h1>
    <button id="tombolNama">Isi Nama</button>

    <script>
        const judul = document.getElementById("judul");
        const tombol = document.getElementById("tombolNama");

        tombol.addEventListener("click", function(){
            judul.innerText = "Nama: Budi"
        })
    </script>
</body>

</html>
